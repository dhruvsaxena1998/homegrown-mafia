<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1018" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: that makes the web view render full-screen while
         iOS still reports a viewport shortened by the status bar, so a 100dvh
         shell ends an inset-height above the bottom edge. Nothing here wants to
         sit under the status bar anyway — the header already clears it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Homegrown Mafia" />
    <meta
      name="description"
      content="Pass-and-play Mafia for one phone. Deals the cards, runs the night, works offline."
    />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Homegrown Mafia — pass and play on one phone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
